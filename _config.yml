title: Teo's blog
email: zengwc.teo2016@outlook.com
description: >-
  Things I build, explained with figures you can play with.
baseurl: "/blogs"
url: "https://sir-teo.github.io"
lang: en
github_username: Sir-Teo
author:
  name: Teo
  email: zengwc.teo2016@outlook.com
timezone: America/New_York

# Own layouts only. GitHub Pages applies the Primer theme unless this is null.
theme: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

exclude:
  - .bundle/
  - .claude/
  - .git/
  - .github/
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
