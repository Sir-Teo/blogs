title: Teo's Research Notebook
email: zengwc.teo2016@outlook.com
description: >-
  Notes on AI, machine learning, data systems, mathematics, statistics, and
  the psychology of building reliable things.
baseurl: "/blogs"
url: "https://sir-teo.github.io"
github_username: Sir-Teo
author:
  name: Teo
  email: zengwc.teo2016@outlook.com
timezone: America/New_York
show_excerpts: true

remote_theme: jekyll/minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-sitemap

minima:
  date_format: "%b %-d, %Y"

header_pages:
  - about.markdown
  - tags.html

exclude:
  - .bundle/
  - .git/
  - .github/
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
