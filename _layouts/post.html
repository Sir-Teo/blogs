---
layout: default
---
{%- assign words = content | strip_html | number_of_words -%}
{%- assign minutes = words | plus: 115 | divided_by: 230 -%}
{%- assign figs = content | split: '<figure class="fig' | size | minus: 1 -%}
{%- assign series = nil -%}
{%- assign parts = nil -%}
{%- assign part_num = 0 -%}
{%- if page.series -%}
  {%- assign series = site.data.series[page.series] -%}
  {%- if series -%}
    {%- assign parts = site.posts | where: "series", page.series | sort: "date" -%}
    {%- for part in parts %}{% if part.url == page.url %}{% assign part_num = forloop.index %}{% endif %}{% endfor -%}
  {%- endif -%}
{%- endif -%}
<article class="post-article{% if page.article_class %} {{ page.article_class | escape }}{% endif %}">
  <header class="post-heading post-head">
    {%- if page.kicker %}
    <p class="post-kicker">{% if series %}<a href="#series-title">{{ page.kicker | escape }}</a>{% else %}{{ page.kicker | escape }}{% endif %}</p>
    {%- elsif series %}
    <p class="post-kicker"><a href="#series-title">{{ series.title | escape }}{% if parts.size > 1 %} · Part {{ part_num }} of {{ parts.size }}{% endif %}</a></p>
    {%- endif %}
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {%- if page.deck %}
    <p class="post-subtitle post-deck">{{ page.deck | escape }}</p>
    {%- endif %}
    <div class="publish-metadata">
      {%- unless page.neutral %}
      <p class="post-author">{{ site.author.name | default: "Teo" | escape }}</p>
      {%- endunless %}
      <p class="meta post-date-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
        {%- if figs > 0 %}
        <span>{{ figs }} {% if figs == 1 %}figure{% else %}figures{% endif %}</span>
        {%- endif %}
        <span>{{ minutes | at_least: 1 }} min read</span>
      </p>
      {%- if page.links %}
      <p class="post-header-links meta-links">
        {%- for link in page.links %}
        <a href="{{ link.url }}">{{ link.title | escape }}</a>
        {%- endfor %}
      </p>
      {%- endif %}
    </div>
  </header>

  <div class="post-content-shell">
    <div class="post-content content">
      {{ content }}
    </div>
  </div>

  {%- if series %}
  <aside class="series-box" aria-labelledby="series-title">
    <p class="series-label">Series</p>
    <h2 class="series-title" id="series-title">{{ series.title | escape }}</h2>
    {%- if series.blurb %}
    <p class="series-blurb">{{ series.blurb | escape }}</p>
    {%- endif %}
    <ol class="series-list">
      {%- for part in parts %}
      <li>
        {%- if part.url == page.url -%}
        <span aria-current="page">{{ part.title | escape }}</span><span class="series-here">You are here</span>
        {%- else -%}
        <a href="{{ part.url | relative_url }}">{{ part.title | escape }}</a>
        {%- endif -%}
      </li>
      {%- endfor %}
    </ol>
  </aside>
  {%- endif %}

  {%- unless page.neutral %}
  <nav class="paginator post-nav" aria-label="More posts">
    <div class="paginator-prev">
      {%- if page.previous %}
      <a rel="prev" href="{{ page.previous.url | relative_url }}">
        <span class="paginator-label">&larr; Previous</span>
        <span class="paginator-title">{{ page.previous.title | escape }}</span>
      </a>
      {%- endif %}
    </div>
    <div class="paginator-top">
      <a href="#top">Back to top</a>
    </div>
    <div class="paginator-next">
      {%- if page.next %}
      <a rel="next" href="{{ page.next.url | relative_url }}">
        <span class="paginator-label">Next &rarr;</span>
        <span class="paginator-title">{{ page.next.title | escape }}</span>
      </a>
      {%- endif %}
    </div>
  </nav>
  {%- endunless %}
</article>
